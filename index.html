<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --danger: #dc2626; --success: #16a34a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #64748b; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; }
        .form-row div { flex: 1; }
    </style>
</head>
<body>

<div class="container">

    <!-- AUTHENTICATION SCREEN -->
    <div id="authCard" class="card" style="max-width: 400px; margin: 60px auto;">
        <h2>🔐 Portal Login</h2>
        <div class="tabs">
            <div id="loginTab" class="tab active" onclick="switchTab('login')">Login</div>
            <div id="signupTab" class="tab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <div id="signupFields" class="hidden">
            <label>First Name</label>
            <input type="text" id="regFirstName" placeholder="Hoor">
            <label>Last Name</label>
            <input type="text" id="regLastName" placeholder="Khalid">
        </div>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="user@example.com">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">

        <button id="authBtn" style="width: 100%;" onclick="handleAuth()">Login</button>
        <p id="authError" style="color: red; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- PROTECTED TASK DASHBOARD -->
    <div id="dashboard" class="hidden">
        <div class="header-bar">
            <h2>📋 Task Management Table</h2>
            <button onclick="logout()" style="background: #64748b;">Logout</button>
        </div>

        <!-- CREATE / EDIT TASK FORM -->
        <div class="card">
            <h3 id="formTitle">Add New Task</h3>
            <input type="hidden" id="taskId">
            <div class="form-row">
                <div>
                    <label>Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Build RAG pipeline">
                </div>
                <div>
                    <label>Status</label>
                    <select id="taskStatus">
                        <option value="PENDING">PENDING</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="COMPLETED">COMPLETED</option>
                    </select>
                </div>
            </div>
            <label>Description</label>
            <input type="text" id="taskDescription" placeholder="Detailed notes about the task...">
            
            <div style="display: flex; gap: 10px;">
                <button id="saveTaskBtn" onclick="saveTask()">Create Task</button>
                <button id="cancelBtn" class="hidden" style="background:#94a3b8;" onclick="resetTaskForm()">Cancel</button>
            </div>
        </div>

        <!-- TASKS TABLE -->
        <div class="card">
            <h3>Database Records (`tasks` table)</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const USER_API = 'http://localhost:8080/api/users';
    const TASK_API = 'http://localhost:8080/api/tasks';
    let isSignup = false;

    function switchTab(tab) {
        isSignup = (tab === 'signup');
        document.getElementById('loginTab').classList.toggle('active', !isSignup);
        document.getElementById('signupTab').classList.toggle('active', isSignup);
        document.getElementById('signupFields').classList.toggle('hidden', !isSignup);
        document.getElementById('authBtn').innerText = isSignup ? 'Sign Up' : 'Login';
        document.getElementById('authError').innerText = '';
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const firstName = document.getElementById('regFirstName').value;
        const lastName = document.getElementById('regLastName').value;
        const errorEl = document.getElementById('authError');

        const endpoint = isSignup ? `${USER_API}/signup` : `${USER_API}/login`;
        const payload = isSignup ? { firstName, lastName, email, password } : { email, password };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('authCard').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadTasks();
            } else {
                const errText = await response.text();
                errorEl.innerText = errText || 'Authentication failed.';
            }
        } catch (err) {
            errorEl.innerText = 'Cannot connect to backend server.';
        }
    }

    async function loadTasks() {
        try {
            const response = await fetch(TASK_API);
            const tasks = await response.json();
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = '';

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No tasks found in PostgreSQL database.</td></tr>';
                return;
            }

            tasks.forEach(task => {
                tbody.innerHTML += `
                    <tr>
                        <td>${task.id}</td>
                        <td><strong>${task.title}</strong></td>
                        <td>${task.description || '-'}</td>
                        <td><code>${task.status}</code></td>
                        <td>
                            <button class="btn-success" onclick='editTask(${JSON.stringify(task)})'>Edit</button>
                            <button class="btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error('Failed to fetch tasks:', err);
        }
    }

    async function saveTask() {
        const id = document.getElementById('taskId').value;
        const title = document.getElementById('taskTitle').value;
        const description = document.getElementById('taskDescription').value;
        const status = document.getElementById('taskStatus').value;

        if (!title) {
            alert('Please provide a task title');
            return;
        }

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${TASK_API}/${id}` : TASK_API;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description, status })
        });

        resetTaskForm();
        loadTasks();
    }

    function editTask(task) {
        document.getElementById('formTitle').innerText = `Edit Task #${task.id}`;
        document.getElementById('taskId').value = task.id;
        document.getElementById('taskTitle').value = task.title;
        document.getElementById('taskDescription').value = task.description || '';
        document.getElementById('taskStatus').value = task.status;
        document.getElementById('saveTaskBtn').innerText = 'Update Task';
        document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function resetTaskForm() {
        document.getElementById('formTitle').innerText = 'Add New Task';
        document.getElementById('taskId').value = '';
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDescription').value = '';
        document.getElementById('taskStatus').value = 'PENDING';
        document.getElementById('saveTaskBtn').innerText = 'Create Task';
        document.getElementById('cancelBtn').classList.add('hidden');
    }

    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;
        await fetch(`${TASK_API}/${id}`, { method: 'DELETE' });
        loadTasks();
    }

    function logout() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('authCard').classList.remove('hidden');
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        resetTaskForm();
    }
</script>

</body>
</html>
